[project]
name = "netatmo-homesecurity"
version = "0.1.2"
requires-python = ">=3.13"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest-homeassistant-custom-component", "pytest-asyncio", "PyTurboJPEG"]

[tool.pytest.ini_options]
